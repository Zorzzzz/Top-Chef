<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Top Chefs👌🏻</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header><h1>Top Chefs👌🏻 - Register</h1></header>
<nav>
  <a href="home.html" class="nav-link">Home</a>
  <a href="login.html" class="nav-link">Login</a>
  <span id="loginBtn"></span>
</nav>

<h2 class="section-title">Create Account</h2>

<div class="container" style="flex-direction:column; max-width:400px; margin:auto;">
  <div class="input-field"><label>Username</label><input type="text" id="regUsername"></div>
  <div class="input-field"><label>Password</label><input type="password" id="regPassword"></div>
  <div class="input-field"><label>Confirm Password</label><input type="password" id="regConfirm"></div>
  <button class="submit-btn" onclick="register()">Register</button>
</div>

<script src="login.js"></script>
<script>
function register(){
  const username = document.getElementById("regUsername").value.trim();
  const password = document.getElementById("regPassword").value;
  const confirm = document.getElementById("regConfirm").value;

  if(!username || !password || !confirm){ alert("Fill all fields!"); return; }
  if(password!==confirm){ alert("Passwords do not match!"); return; }

  let users = JSON.parse(localStorage.getItem("users")||"[]");
  if(users.some(u=>u.username===username)){
    alert("Username already exists!"); return;
  }

  users.push({username,password});
  localStorage.setItem("users",JSON.stringify(users));
  alert("Registration Successful! You can now login.");
  window.location.href="login.html";
}
</script>

<footer>&copy; 2025 Top Chefs👌🏻</footer>
</body>
</html>
