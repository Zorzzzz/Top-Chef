<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - Top Chefs👌🏻</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header><h1>Admin Panel - Top Chefs👌🏻</h1></header>

<nav>
  <a href="home.html">Home</a>
  <span id="loginBtn"></span>
</nav>

<h2 class="section-title">Add Recipe</h2>

<div class="container" style="flex-direction:column; max-width:400px; margin:auto;">
  <div class="input-field"><label>Recipe Name</label><input id="foodName"></div>
  <div class="input-field"><label>Description</label><textarea id="foodDesc"></textarea></div>
  <div class="input-field"><label>Image URL</label><input id="foodImg"></div>
  <div class="input-field"><label>Category</label>
    <select id="foodCategory">
      <option value="مقبلات">مقبلات</option>
      <option value="سلطات">سلطات</option>
      <option value="طبق رئيسي">طبق رئيسي</option>
      <option value="مشروبات">مشروبات</option>
      <option value="حلويات">حلويات</option>
    </select>
  </div>
  <button class="submit-btn" onclick="addFood()">Add Recipe</button>
</div>

<h2 class="section-title">Existing Recipes</h2>
<div class="container" id="foodList" style="flex-direction:column; max-width:600px; margin:auto;"></div>

<script src="login.js"></script>
<script>
updateLoginBtn();

function loadFoods(){
  let foods = JSON.parse(localStorage.getItem("foods")||"[]");
  const container = document.getElementById("foodList");
  container.innerHTML = "";
  foods.forEach((f,i)=>{
    const div = document.createElement("div");
    div.className="food-card";
    div.style.display="flex"; 
    div.style.justifyContent="space-between";
    div.style.alignItems="center";
    div.style.marginBottom="10px";
    div.innerHTML = `
      <div>
        <strong>${f.name}</strong> - ${f.category} <br> ${f.desc}
      </div>
      <button onclick="deleteFood(${i})" class="submit-btn" style="background:red;">Delete</button>
    `;
    container.appendChild(div);
  });
}
loadFoods();

function addFood(){
  const name=document.getElementById("foodName").value.trim();
  const desc=document.getElementById("foodDesc").value.trim();
  const category=document.getElementById("foodCategory").value.trim();
  const img=document.getElementById("foodImg").value.trim();
  if(!name||!desc||!category||!img){ alert("Fill all fields!"); return; }
  let foods = JSON.parse(localStorage.getItem("foods")||"[]");
  foods.push({name,desc,category,img,reviews:[]});
  localStorage.setItem("foods",JSON.stringify(foods));
  alert("Recipe added!");
  document.getElementById("foodName").value="";
  document.getElementById("foodDesc").value="";
  document.getElementById("foodCategory").value="";
  document.getElementById("foodImg").value="";
  loadFoods();
}

function deleteFood(idx){
  let foods = JSON.parse(localStorage.getItem("foods")||"[]");
  if(confirm(`Delete ${foods[idx].name}?`)){
    foods.splice(idx,1);
    localStorage.setItem("foods",JSON.stringify(foods));
    loadFoods();
  }
}
</script>

<footer>&copy; 2025 Top Chefs👌🏻</footer>
</body>
</html>
