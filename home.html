  }

  .main-hero video {
    position: absolute;
    top: 0;
    left: 0;

    align-items: center;

    height: auto;

  }

  .main-hero h1 {
    font-size: 48px;
    margin: 0;
    color: white;
    text-shadow: 2px 2px 8px rgba(0,0,0,0.7);
  }

  nav a, nav button {
    color: white; 
    text-decoration:none; 
    margin-left:10px; 
    background:none; 
    border:none; 
    font-size:14px; 
    cursor:pointer;
  }

  button.logout-btn {
    background:#0077b6; 
    border:none; 
    padding:5px 10px; 
    border-radius:4px; 
    cursor:pointer; 
    color:white;
  }
