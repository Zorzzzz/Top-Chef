<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu - Top Chefs👌🏻</title>
<link rel="stylesheet" href="style.css">
<style>
  .food-card { border:1px solid #ccc; border-radius:6px; padding:15px; margin-bottom:15px; max-width:400px; }
  .stars span { cursor:pointer; font-size:20px; color:lightgray; margin-right:3px;}
  .stars span.filled { color:gold; }
</style>
</head>
<body>

<header><h1>Top Chefs👌🏻</h1></header>

<nav>
  <a href="home.html">Home</a>
  <a href="about.html">About</a>
  <a href="menu.html">Menu</a>
  <a href="feedback.html">Feedback</a>
  <span id="loginBtn"></span>
</nav>

<h2 class="section-title">Recipes</h2>
<div class="container" id="foodContainer"></div>

<script src="login.js"></script>
<script>
updateLoginBtn();

let foods = JSON.parse(localStorage.getItem("foods")||"[]");

function renderFoods(){
  const container = document.getElementById("foodContainer");
  const currentUser = localStorage.getItem("currentUser");
  container.innerHTML="";
  foods.forEach((f,i)=>{
    let avg = f.reviews && f.reviews.length ? (f.reviews.reduce((a,b)=>a+b.rating,0)/f.reviews.length).toFixed(1) : 0;
    const div = document.createElement("div");
    div.className="food-card";
    div.innerHTML = `
      <img src="${f.img}" alt="${f.name}">
      <h3>${f.name}</h3>
      <p>${f.desc}</p>
      <p>Category: ${f.category}</p>
      <p>Average Rating: ${avg} / 5</p>
      <div class="stars">
        ${[1,2,3,4,5].map(n=>`<span data-i="${i}" data-star="${n}" class="${n<=Math.round(avg)?'filled':''}">&#9733;</span>`).join("")}
      </div>
    `;
    container.appendChild(div);
  });

  document.querySelectorAll(".stars span").forEach(s=>{
    s.addEventListener("click", e=>{
      const idx = e.target.dataset.i;
      const star = +e.target.dataset.star;
      if(!currentUser){ alert("Please login to rate!"); return; }
      if(!foods[idx].reviews) foods[idx].reviews=[];
      if(foods[idx].reviews.some(r=>r.user===currentUser)){
        alert("You have already rated this recipe!"); return;
      }
      foods[idx].reviews.push({user:currentUser, rating:star});
      localStorage.setItem("foods",JSON.stringify(foods));
      renderFoods();
    });
  });
}

renderFoods();
</script>
</body>
</html>
